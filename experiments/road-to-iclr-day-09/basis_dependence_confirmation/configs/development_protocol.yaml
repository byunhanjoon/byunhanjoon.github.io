experiment: basis_dependence_confirmation
protocol_version: 1
split_seed: 20260901
model_seeds: [0, 1, 2]
orbit_members: 8
max_train_rows: 1024
max_validation_rows: 256
max_test_rows: 512
minimum_continuous_unique_values: 16
basis_dimension: 8
rbf_width_rule: median_positive_adjacent_center_gap
one_block_rule: highest_training_variance_then_lexicographic
models:
  tabicl_v2:
    n_estimators: 1
  tabpfn_2_6:
    n_estimators: 1
  tabm_d:
    n_cv: 1
    n_refit: 0
    n_epochs: 30
    patience: 5
  catboost:
    iterations: 200
    depth: 7
    learning_rate: 0.05
  controlled_mlp:
    hidden_layers: 3
    width: 256
    activation: GELU
    batch_norm: false
    dropout: 0.0
    optimizer: AdamW
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 256
    max_epochs: 100
    patience: 15
transforms:
  orthogonal_one_block: 8
  orthogonal_all_blocks: 8
  condition_le_3_all_blocks: 8
  enforce_positive_determinant: true
condition_le_3_singular_value_interval: [0.5773502691896258, 1.7320508075688772]
natural_bases:
  onehot_helmert: true
  fourier_origin: true
  local_spectral_hat: true
  polynomial_secondary: false
remedies:
  standardization: true
  whitening: true
  pca_canonical: true
  anchor_canonical:
    anchors: 16
    selection: fixed_rng_row_indices
    float_precision: float64
  orbit_consistency_lambda: 1.0
  oracle_inverse_diagnostic: true
hpo:
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decays: [0.0, 0.00001, 0.0001]
  maximum_trials_per_representation: 9
bootstrap_draws: 10000
prospective_policy:
  locked_until_frozen_method_config_exists: true
  run_once: true

