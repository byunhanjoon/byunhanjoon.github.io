experiment: semantic_orbit_training_ablations
protocol_version: 1
parent_config: semantic_orbits.yaml
split_seed: 20260901
model_seeds: [0, 1, 2]
orbit_members: 8
max_train_rows: 2048
max_validation_rows: 512
max_test_rows: 512
datasets:
