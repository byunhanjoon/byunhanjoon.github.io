experiment: semantic_symmetries_representation_orbits
protocol_version: 1
split_seed: 20260901
model_seeds: [0, 1, 2]
orbit_members: 8
max_train_rows: 2048
max_validation_rows: 512
max_test_rows: 512
tfm_estimators: 1
catboost_iterations: 200
datasets:
  - name: adult
    openml_id: 1590
    openml_version: 2
    problem_type: classification
  - name: bank-marketing
    openml_id: 1461
    openml_version: 1
    problem_type: classification
    cyclic_aliases:
      V11: 12
  - name: diamonds
    openml_id: 42225
    openml_version: 1
    problem_type: regression
    ordinal_orders:
      cut: [Fair, Good, Very Good, Premium, Ideal]
      color: [J, I, H, G, F, E, D]
      clarity: [I1, SI2, SI1, VS2, VS1, VVS2, VVS1, IF]
  - name: bike-sharing
    openml_id: 42712
    openml_version: 2
    problem_type: regression
    cyclic_periods:
      hour: 24
      weekday: 7
      month: 12
  - name: california_housing
    openml_id: 43939
    openml_version: 1
    problem_type: regression
  - name: wine-quality-red
    openml_id: 40691
    openml_version: 1
    problem_type: regression
    coerce_target_numeric: true
models:
  tabicl_v2:
    pipelines: [numeric_code]
  tabpfn_2_6:
    pipelines: [native_categorical, numeric_code]
  catboost:
    pipelines: [native_categorical, numeric_code]
transformations:
  column_permutation: true
  nominal_relabeling: true
  numerical_scaling: true
  numerical_affine: true
  monotone_recoding: true
  ordinal_spacing: true
  cyclic_recoding: true
  equivalent_basis: true
basis:
  n_functions: 8
  condition_bands: [orthogonal, cond_le_3, cond_le_10]
repairs:
  standardization: true
  quantile_rank: true
  nominal_canonicalization: true
  ordinal_canonicalization: true
  cyclic_frontend: true
  orbit_ensemble: true
