# Frozen Phase-A search space. The pilot uses the single preregistered setting;
# selector variants are deferred to the explicit discretization ablation.
n_nodes: [3]
selector: [straight_through_gumbel]
discrete_warm_start: [true]
start_temperature: [2.0]
end_temperature: [0.12]
learning_rate: [0.025]
entropy_weight: [0.0002]
epochs: [150]
operators:
  - [identity, add, subtract, multiply, safe_divide, abs, square]
