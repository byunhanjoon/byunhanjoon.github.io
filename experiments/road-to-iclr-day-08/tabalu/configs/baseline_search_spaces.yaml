# Frozen before the Phase-A pilot. Budgets are intentionally modest and equal
# across all generated tasks; validation data chooses only the listed variants.
Linear:
  fit_intercept: [true]
RandomForest:
  n_estimators: [300]
  min_samples_leaf: [2]
  max_features: [1.0]
PolynomialSR:
  degree: [3]
  alpha: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
MLP:
  hidden_width: [64]
  hidden_layers: [3]
  learning_rate: [0.002]
  epochs: [600]
EQL:
  layers: [2]
  linear_units: [12, 8]
  product_units: [8, 8]
  learning_rate: [0.002]
  epochs: [600]
